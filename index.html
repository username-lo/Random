<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Follower Game</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 5px 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        p {
            margin: 0 0 15px 0;
            color: #aaa;
            font-size: 14px;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background: #222;
            display: block;
            cursor: none; /* Hide real cursor over the game */
        }

        #statusOverlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 40px;
            border-radius: 10px;
            border: 2px solid #444;
            display: none;
        }

        #statusText {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            background: #00adb5;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #00f5ff;
        }
    </style>
</head>
<body>

    <h1>Line & Ball Game</h1>
    <p>Guide the ball carefully along the track to the green zone. Don't fall off!</p>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="statusOverlay">
            <div id="statusText">YOU WIN!</div>
            <button id="actionBtn" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('statusOverlay');
        const statusText = document.getElementById('statusText');
        const actionBtn = document.getElementById('actionBtn');

        // Game Configuration
        const pathWidth = 40; 
        const ballRadius = 10;
        
        // Define the track checkpoints (centers of the line segments)
        const pathPoints = [
            {x: 50, y: 250},
            {x: 200, y: 250},
            {x: 200, y: 100},
            {x: 450, y: 100},
            {x: 450, y: 400},
            {x: 650, y: 400},
            {x: 650, y: 250},
            {x: 750, y: 250}
        ];

        let ball = { x: 50, y: 250 };
        let gameActive = true;
        let hasStarted = false;

        // Check distance from a point to a line segment
        function getDistanceToSegment(p, a, b) {
            let ab = { x: b.x - a.x, y: b.y - a.y };
            let ap = { x: p.x - a.x, y: p.y - a.y };
            let abLenSq = ab.x * ab.x + ab.y * ab.y;
            
            if (abLenSq === 0) return Math.sqrt(ap.x * ap.x + ap.y * ap.y);
            
            // Project p onto ab, clamp to segment bounds
            let t = (ap.x * ab.x + ap.y * ab.y) / abLenSq;
            t = Math.max(0, Math.min(1, t));
            
            let closest = { x: a.x + t * ab.x, y: a.y + t * ab.y };
            let dx = p.x - closest.x;
            let dy = p.y - closest.y;
            
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Verify if ball position is legally inside the track bounds
        function isBallOnPath(p) {
            for (let i = 0; i < pathPoints.length - 1; i++) {
                if (getDistanceToSegment(p, pathPoints[i], pathPoints[i+1]) <= (pathWidth / 2)) {
                    return true;
                }
            }
            return false;
        }

        // Track mouse movements to update ball placement
        canvas.addEventListener('mousemove', (e) => {
            if (!gameActive) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Start condition: player must hover near the starting point first
            if (!hasStarted) {
                let startDist = Math.hypot(mouseX - pathPoints[0].x, mouseY - pathPoints[0].y);
                if (startDist < pathWidth / 2) {
                    hasStarted = true;
                } else {
                    return; // Ignore movements until they touch the start
                }
            }

            ball.x = mouseX;
            ball.y = mouseY;

            // Check Win Condition (Reached the last point area)
            let finishPoint = pathPoints[pathPoints.length - 1];
            let distToFinish = Math.hypot(ball.x - finishPoint.x, ball.y - finishPoint.y);
            if (distToFinish <= ballRadius) {
                endGame(true);
                return;
            }

            // Check Lose Condition (Stepped off track limits)
            if (!isBallOnPath(ball)) {
                endGame(false);
            }
        });

        function endGame(isWin) {
            gameActive = false;
            overlay.style.display = 'block';
            if (isWin) {
                statusText.innerText = 'YOU WIN! 🎉';
                statusText.style.color = '#4caf50';
                actionBtn.innerText = 'Play Again';
            } else {
                statusText.innerText = 'GAME OVER 💥';
                statusText.style.color = '#f44336';
                actionBtn.innerText = 'Try Again';
            }
        }

        function resetGame() {
            ball = { x: pathPoints[0].x, y: pathPoints[0].y };
            gameActive = true;
            hasStarted = false;
            overlay.style.display = 'none';
        }

        // Core Render loop
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw the track lines
            ctx.beginPath();
            ctx.strokeStyle = '#33334d';
            ctx.lineWidth = pathWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
            for (let i = 1; i < pathPoints.length; i++) {
                ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
            }
            ctx.stroke();

            // 2. Draw Start Zone indicator
            ctx.beginPath();
            ctx.fillStyle = '#ff9800';
            ctx.arc(pathPoints[0].x, pathPoints[0].y, pathWidth / 2, 0, Math.PI * 2);
            ctx.fill();

            // 3. Draw Finish Zone indicator
            let finish = pathPoints[pathPoints.length - 1];
            ctx.beginPath();
            ctx.fillStyle = '#4caf50';
            ctx.arc(finish.x, finish.y, pathWidth / 2, 0, Math.PI * 2);
            ctx.fill();

            // Text labels for Start and End
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('START', pathPoints[0].x, pathPoints[0].y);
            ctx.fillText('WIN', finish.x, finish.y);

            // 4. Draw the user-controlled Ball
            ctx.beginPath();
            ctx.fillStyle = hasStarted ? '#00adb5' : '#777';
            ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
            ctx.shadowBlur = hasStarted ? 10 : 0;
            ctx.shadowColor = '#00adb5';
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow

            // Helper text before initializing gameplay
            if (!hasStarted && gameActive) {
                ctx.fillStyle = '#ff9800';
                ctx.font = '16px sans-serif';
                ctx.fillText('👈 Hover your cursor here to Start!', pathPoints[0].x + 130, pathPoints[0].y + 5);
            }

            requestAnimationFrame(draw);
        }

        // Initialize display
        draw();
    </script>
</body>
</html>
