<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Multiplayer Grid Racer</title>
    <!-- Include PeerJS for free Peer-to-Peer multiplayer networking -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            margin: 0;
            background: #1e1e24;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 { margin: 10px 0 5px 0; font-size: 26px; }
        
        #lobby {
            background: #2a2a35;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #turnIndicator {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            background: #2a2a35;
            display: none;
        }

        .p1-turn { color: #38b000; border: 2px solid #38b000; box-shadow: 0 0 10px rgba(56,176,0,0.3); }
        .p2-turn { color: #e05780; border: 2px solid #e05780; box-shadow: 0 0 10px rgba(224,87,128,0.3); }

        #gameContainer { position: relative; display: none; }
        canvas {
            background: #111116;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        #overlay.show { opacity: 1; pointer-events: auto; }
        #winnerText { font-size: 36px; font-weight: bold; margin-bottom: 20px; }
        
        button {
            background: #4a4ae2;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #6363f7; }
        input {
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            width: 200px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Grid Line Racer (Online)</h1>
    
    <div id="lobby">
        <div id="lobbyStatus">Initializing network...</div>
        <div id="setupActions" style="margin-top: 15px; display:none;">
            <button onclick="hostGame()">Host Game</button>
            <span style="margin: 0 10px;">or</span>
            <input type="text" id="joinIdInput" placeholder="Paste Room ID here">
            <button onclick="joinGame()">Join Game</button>
        </div>
    </div>

    <div id="turnIndicator">Waiting for players...</div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="overlay">
            <div id="winnerText">PLAYER 1 WINS!</div>
            <button onclick="restartMatch()">Rematch</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const turnIndicator = document.getElementById('turnIndicator');
        const overlay = document.getElementById('overlay');
        const winnerText = document.getElementById('winnerText');
        const lobbyStatus = document.getElementById('lobbyStatus');
        const setupActions = document.getElementById('setupActions');
        const joinIdInput = document.getElementById('joinIdInput');

        // Grid Design Setup
        const gridSize = 7;
        const cellSize = 70;
        const offset = 55;
        const wallThickness = 8;
        const clickTolerance = 15;

        // Multiplayer state vars
        let peer, conn;
        let myRole = null; // 'P1' (Host) or 'P2' (Joiner)
        let p1, p2, turn, walls, gameOver;

        // Initialize Networking First
        peer = new Peer();
        
        peer.on('open', (id) => {
            lobbyStatus.innerText = "Ready to connect!";
            setupActions.style.display = "block";
        });

        peer.on('error', (err) => {
            alert("Network error: " + err.type);
        });

        // 1. HOST SIDE LOGIC
        function hostGame() {
            myRole = 'P1';
            lobbyStatus.innerHTML = `Room Created! Send this ID to your friend:<br><b style='color:#00f5ff; font-size:18px;'>${peer.id}</b><br><br>Waiting for them to join...`;
            setupActions.style.display = "none";

            peer.on('connection', (connection) => {
                conn = connection;
                setupNetworkHandlers();
                startGameSession();
            });
        }

        // 2. JOINER SIDE LOGIC
        function joinGame() {
            const targetId = joinIdInput.value.trim();
            if (!targetId) return alert("Please paste a valid Room ID");
            
            myRole = 'P2';
            lobbyStatus.innerText = "Connecting to host...";
            setupActions.style.display = "none";

            conn = peer.connect(targetId);
            
            conn.on('open', () => {
                setupNetworkHandlers();
                startGameSession();
            });
        }

        // 3. SYNC DATA BETWEEN BROWSERS
        function setupNetworkHandlers() {
            conn.on('data', (data) => {
                if (data.type === 'move') {
                    p1 = data.p1;
                    p2 = data.p2;
                    walls = data.walls;
                    turn = data.turn;
                    checkWinConditions();
                    updateTurnUI();
                    draw();
                } else if (data.type === 'rematch') {
                    initGameState();
                }
            });

            conn.on('close', () => {
                alert("Opponent disconnected.");
                window.location.reload();
            });
        }

        function startGameSession() {
            document.getElementById('lobby').style.display = 'none';
            turnIndicator.style.display = 'block';
            document.getElementById('gameContainer').style.display = 'block';
            initGameState();
        }

        function initGameState() {
            p1 = { r: 0, c: 3 };
            p2 = { r: gridSize - 1, c: 3 };
            turn = 1; // P1 always goes first
            walls = [];
            gameOver = false;
            
            overlay.classList.remove('show');
            updateTurnUI();
            draw();
        }

        function updateTurnUI() {
            let activeRole = (turn === 1) ? 'P1' : 'P2';
            let roleColorClass = (turn === 1) ? "p1-turn" : "p2-turn";
            let roleName = (turn === 1) ? "Player 1 (Blue)" : "Player 2 (Red)";

            if (myRole === activeRole) {
                turnIndicator.innerText = `Your Turn (${roleName}) - Click to Move or Block`;
            } else {
                turnIndicator.innerText = `Opponent's Turn (${roleName}). Waiting...`;
            }
            turnIndicator.className = turnIndicator.className = roleColorClass;
        }

        function sendState() {
            conn.send({
                type: 'move',
                p1: p1,
                p2: p2,
                walls: walls,
                turn: turn
            });
        }

        function restartMatch() {
            initGameState();
            conn.send({ type: 'rematch' });
        }

        function hasWall(r, c, edge) {
            return walls.some(w => {
                if (edge === 'top') return w.type === 'H' && w.r === r && w.c === c;
                if (edge === 'bottom') return w.type === 'H' && w.r === r + 1 && w.c === c;
                if (edge === 'left') return w.type === 'V' && w.r === r && w.c === c;
                if (edge === 'right') return w.type === 'V' && w.r === r && w.c === c + 1;
                return false;
            });
        }

        canvas.addEventListener('click', (e) => {
            if (gameOver) return;
            
            // Block clicking if it's not your turn
            if ((turn === 1 && myRole !== 'P1') || (turn === 2 && myRole !== 'P2')) {
                return; 
            }

            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            let currentPlayer = (turn === 1) ? p1 : p2;

            // Tile grid selection detection
            let targetC = Math.floor((mx - offset) / cellSize);
            let targetR = Math.floor((my - offset) / cellSize);

            if (targetC >= 0 && targetC < gridSize && targetR >= 0 && targetR < gridSize) {
                let dr = targetR - currentPlayer.r;
                let dc = targetC - currentPlayer.c;

                if (Math.abs(dr) + Math.abs(dc) === 1) {
                    let blocked = false;
                    if (dr === -1 && hasWall(currentPlayer.r, currentPlayer.c, 'top')) blocked = true;
                    if (dr === 1 && hasWall(currentPlayer.r, currentPlayer.c, 'bottom')) blocked = true;
                    if (dc === -1 && hasWall(currentPlayer.r, currentPlayer.c, 'left')) blocked = true;
