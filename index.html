<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Race & Block Game</title>
    <style>
        body {
            margin: 0;
            background: #1e1e24;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 { margin: 10px 0 5px 0; font-size: 26px; }
        #turnIndicator {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            background: #2a2a35;
            transition: all 0.3s;
        }

        .p1-turn { color: #38b000; border: 2px solid #38b000; box-shadow: 0 0 10px rgba(56,176,0,0.3); }
        .p2-turn { color: #e05780; border: 2px solid #e05780; box-shadow: 0 0 10px rgba(224,87,128,0.3); }

        #gameContainer { position: relative; }
        canvas {
            background: #111116;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        #overlay.show { opacity: 1; pointer-events: auto; }
        #winnerText { font-size: 36px; font-weight: bold; margin-bottom: 20px; }
        
        button {
            background: #4a4ae2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #6363f7; }
    </style>
</head>
<body>

    <h1>Grid Line Racer</h1>
    <div id="turnIndicator" class="p1-turn">Player 1's Turn (Blue)</div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="overlay">
            <div id="winnerText">PLAYER 1 WINS!</div>
            <button onclick="initGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const turnIndicator = document.getElementById('turnIndicator');
        const overlay = document.getElementById('overlay');
        const winnerText = document.getElementById('winnerText');

        // Grid parameters (7x7 squares)
        const gridSize = 7;
        const cellSize = 70;
        const offset = 55; // Margin offset to center the board
        const wallThickness = 8;
        const clickTolerance = 15; // Detection radius around lines

        let p1, p2, turn, walls, gameOver;

        function initGame() {
            // Player pieces track tile coordinates (row, col from 0 to gridSize-1)
            p1 = { r: 0, c: 3 }; // Starts top middle
            p2 = { r: gridSize - 1, c: 3 }; // Starts bottom middle
            turn = 1; // 1 = P1, 2 = P2
            walls = []; // Array tracking placed lines: {type: 'H'|'V', r: num, c: num}
            gameOver = false;
            
            overlay.classList.remove('show');
            updateTurnUI();
            draw();
        }

        function updateTurnUI() {
            if(turn === 1) {
                turnIndicator.innerText = "Player 1's Turn (Move Ball or Place Wall)";
                turnIndicator.className = "p1-turn";
            } else {
                turnIndicator.innerText = "Player 2's Turn (Move Ball or Place Wall)";
                turnIndicator.className = "p2-turn";
            }
        }

        // Check if a line wall exists blocking an edge
        function hasWall(r, c, edge) {
            return walls.some(w => {
                if (edge === 'top') return w.type === 'H' && w.r === r && w.c === c;
                if (edge === 'bottom') return w.type === 'H' && w.r === r + 1 && w.c === c;
                if (edge === 'left') return w.type === 'V' && w.r === r && w.c === c;
                if (edge === 'right') return w.type === 'V' && w.r === r && w.c === c + 1;
                return false;
            });
        }

        canvas.addEventListener('click', (e) => {
            if (gameOver) return;

            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            let currentPlayer = (turn === 1) ? p1 : p2;

            // 1. CHECK FOR PLAYER PIECE CLICK OR MOVEMENT CLICK
            // Convert click coordinates to Row / Column index
            let targetC = Math.floor((mx - offset) / cellSize);
            let targetR = Math.floor((my - offset) / cellSize);

            if (targetC >= 0 && targetC < gridSize && targetR >= 0 && targetR < gridSize) {
                let dr = targetR - currentPlayer.r;
                let dc = targetC - currentPlayer.c;

                // Legal move: exactly 1 space orthoganally and no walls blocking
                if (Math.abs(dr) + Math.abs(dc) === 1) {
                    let blocked = false;
                    if (dr === -1 && hasWall(currentPlayer.r, currentPlayer.c, 'top')) blocked = true;
                    if (dr === 1 && hasWall(currentPlayer.r, currentPlayer.c, 'bottom')) blocked = true;
                    if (dc === -1 && hasWall(currentPlayer.r, currentPlayer.c, 'left')) blocked = true;
                    if (dc === 1 && hasWall(currentPlayer.r, currentPlayer.c, 'right')) blocked = true;

                    if (!blocked) {
                        currentPlayer.r = targetR;
                        currentPlayer.c = targetC;
                        checkWinConditions();
                        if (!gameOver) switchTurn();
                        return;
                    }
                }
            }

            // 2. CHECK FOR WALL PLACEMENT CLICK (if player didn't move)
            // Look for closest grid line intersect within proximity bounds
            for (let r = 0; r <= gridSize; r++) {
                for (let c = 0; c <= gridSize; c++) {
                    let cx = offset + c * cellSize;
                    let cy = offset + r * cellSize;

                    // Horizontal Line segment to the right of intersection point
                    if (c < gridSize && Math.abs(my - cy) < clickTolerance && mx > cx && mx < cx + cellSize) {
                        if (!walls.some(w => w.type === 'H' && w.r === r && w.c === c)) {
                            walls.push({ type: 'H', r: r, c: c });
                            switchTurn();
                            return;
                        }
                    }
                    // Vertical Line segment below intersection point
                    if (r < gridSize && Math.abs(mx - cx) < clickTolerance && my > cy && my < cy + cellSize) {
                        if (!walls.some(w => w.type === 'V' && w.r === r && w.c === c)) {
                            walls.push({ type: 'V', r: r, c: c });
                            switchTurn();
                            return;
                        }
                    }
                }
            }
        });

        function switchTurn() {
            turn = (turn === 1) ? 2 : 1;
            updateTurnUI();
            draw();
        }

        function checkWinConditions() {
            if (p1.r === gridSize - 1) { // Blue reached bottom row
                endGame("PLAYER 1 (BLUE) WINS!");
            } else if (p2.r === 0) { // Red reached top row
                endGame("PLAYER 2 (RED) WINS!");
            }
        }

        function endGame(msg) {
            gameOver = true;
            winnerText.innerText = msg;
            winnerText.style.color = (turn === 1) ? '#38b000' : '#e05780';
            overlay.classList.add('show');
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Goal Rows Background Indicators
            ctx.fillStyle = 'rgba(56, 176, 0, 0.15)'; // Blue/Green goal bottom
            ctx.fillRect(offset, offset + (gridSize - 1) * cellSize, gridSize * cellSize, cellSize);
            ctx.fillStyle = 'rgba(224, 87, 128, 0.15)'; // Red/Pink goal top
            ctx.fillRect(offset, offset, gridSize * cellSize, cellSize);

            // Draw Inner Grid Gridlines (Passive borders)
            ctx.strokeStyle = '#2d2d38';
            ctx.lineWidth = 2;
            for (let i = 0; i <= gridSize; i++) {
                // Horizontals
                ctx.beginPath();
                ctx.moveTo(offset, offset + i * cellSize);
                ctx.lineTo(offset + gridSize * cellSize, offset + i * cellSize);
                ctx.stroke();
                // Verticals
                ctx.beginPath();
                ctx.moveTo(offset + i * cellSize, offset);
                ctx.lineTo(offset + i * cellSize, offset + gridSize * cellSize);
                ctx.stroke();
            }

            // Draw Placed Blockades (Lines)
            ctx.strokeStyle = '#ffb703';
            ctx.lineWidth = wallThickness;
            ctx.lineCap = 'round';
            walls.forEach(w => {
                ctx.beginPath();
                if (w.type === 'H') {
                    ctx.moveTo(offset + w.c * cellSize, offset + w.r * cellSize);
                    ctx.lineTo(offset + (w.c + 1) * cellSize, offset + w.r * cellSize);
                } else {
