<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riddle Master</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 95%;
    max-width: 700px;
    background: #151c35;
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 0 40px rgba(0,0,0,.5);
}

h1 {
    text-align: center;
    margin-top: 0;
    font-size: 38px;
}

.subtitle {
    text-align: center;
    color: #aab4d6;
}

.stats {
    display: flex;
    justify-content: space-between;
    margin: 20px 0;
    color: #cbd4f5;
}

.progress {
    height: 10px;
    background: #292f4a;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-bar {
    height: 100%;
    width: 10%;
    background: #6c63ff;
    transition: .4s;
}

.level {
    text-align: center;
    color: #8f88ff;
    font-weight: bold;
}

.riddle {
    font-size: 24px;
    line-height: 1.5;
    text-align: center;
    margin: 30px 10px;
}

input {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #252d4b;
    color: white;
    font-size: 18px;
    outline: none;
}

input:focus {
    box-shadow: 0 0 0 2px #6c63ff;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: #6c63ff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: scale(1.02);
    background: #7b73ff;
}

.hint {
    background: #303858;
}

.message {
    min-height: 30px;
    text-align: center;
    margin-top: 18px;
    font-weight: bold;
}

.correct {
    color: #55e69b;
}

.wrong {
    color: #ff6b6b;
}

.hint-text {
    color: #ffd166;
    text-align: center;
    margin-top: 15px;
}

#nextBtn {
    display: none;
    background: #22b573;
}

#restartBtn {
    display: none;
    background: #ff5c5c;
}

.final {
    text-align: center;
    display: none;
}

.final h2 {
    font-size: 40px;
    color: #55e69b;
}

.score {
    font-size: 25px;
    margin: 20px;
}
</style>
</head>

<body>

<div class="game">

    <div id="gameScreen">

        <h1>🧠 Riddle Master</h1>
        <p class="subtitle">Only the smartest will reach Level 10.</p>

        <div class="stats">
            <span>❤️ Lives: <b id="lives">3</b></span>
            <span>⭐ Score: <b id="score">0</b></span>
            <span>🏆 Level: <b id="levelNumber">1</b>/10</span>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="level" id="levelTitle">LEVEL 1</div>

        <div class="riddle" id="riddle"></div>

        <input
            id="answer"
            type="text"
            placeholder="Type your answer..."
            autocomplete="off"
        >

        <button onclick="checkAnswer()">SUBMIT ANSWER</button>

        <button class="hint" onclick="showHint()">💡 USE HINT</button>

        <div class="hint-text" id="hint"></div>

        <div class="message" id="message"></div>

        <button id="nextBtn" onclick="nextLevel()">NEXT LEVEL ➜</button>

        <button id="restartBtn" onclick="restartGame()">🔄 PLAY AGAIN</button>

    </div>

    <div class="final" id="finalScreen">
        <h2>🏆 YOU WON!</h2>

        <p>You solved every riddle.</p>

        <div class="score">
            Final Score: <b id="finalScore">0</b>
        </div>

        <p>You're officially a RIDDLE MASTER.</p>

        <button onclick="restartGame()">🔄 PLAY AGAIN</button>
    </div>

</div>

<script>

const riddles = [

    {
        title: "LEVEL 1",
        question: "I have keys but no locks. I have space but no room. You can enter, but you can't go inside. What am I?",
        answers: ["keyboard"],
        hint: "You probably use one to type."
    },

    {
        title: "LEVEL 2",
        question: "The more you take away from me, the bigger I become. What am I?",
        answers: ["hole", "a hole"],
        hint: "Think about digging."
    },

    {
        title: "LEVEL 3",
        question: "I speak without a mouth and hear without ears. I have no body, but I come alive with wind. What am I?",
        answers: ["echo", "an echo"],
        hint: "You might hear me in mountains."
    },

    {
        title: "LEVEL 4",
        question: "I am always in front of you, but can never be seen. What am I?",
        answers: ["future", "the future"],
        hint: "You haven't reached me yet."
    },

    {
        title: "LEVEL 5",
        question: "I have cities but no houses, forests but no trees, and rivers but no water. What am I?",
        answers: ["map", "a map", "the map"],
        hint: "You might use me when traveling."
    },

    {
        title: "LEVEL 6",
        question: "What disappears as soon as you say its name?",
        answers: ["silence", "the silence"],
        hint: "It exists when nobody is talking."
    },

    {
        title: "LEVEL 7",
        question: "I can be cracked, made, told, and played. What am I?",
        answers: ["joke", "a joke"],
        hint: "People laugh at me."
    },

    {
        title: "LEVEL 8",
        question: "I am lighter than a feather, but nobody can hold me for long. What am I?",
        answers: ["breath", "air", "a breath"],
        hint: "You do it automatically."
    },

    {
        title: "LEVEL 9",
        question: "A man looks at a picture and says: 'Brothers and sisters, I have none. But that man's father is my father's son.' Who is in the picture?",
        answers: ["his son", "son", "the man's son"],
        hint: "Remember: he has no brothers or sisters."
    },

    {
        title: "LEVEL 10",
        question: "You have three switches downstairs. One controls a light bulb upstairs. You may switch them however you want, but you can go upstairs only once. How do you determine which switch controls the bulb?",
        answers: ["use heat", "turn one on", "heat", "use the bulb's heat"],
        hint: "The bulb can tell you something even when it is turned off."
    }

];

let currentLevel = 0;
let lives = 3;
let score = 0;
let hintUsed = false;

const riddle = document.getElementById("riddle");
const answer = document.getElementById("answer");
const message = document.getElementById("message");
const hint = document.getElementById("hint");
const livesText = document.getElementById("lives");
const scoreText = document.getElementById("score");
const levelNumber = document.getElementById("levelNumber");
const levelTitle = document.getElementById("levelTitle");
const progress = document.getElementById("progress");
const nextBtn = document.getElementById("nextBtn");
const restartBtn = document.getElementById("restartBtn");

function loadLevel() {

    const level = riddles[currentLevel];

    riddle.textContent = level.question;
    levelTitle.textContent = level.title;

    levelNumber.textContent = currentLevel + 1;

    progress.style.width =
        ((currentLevel + 1) / riddles.length * 100) + "%";

    answer.value = "";
    hint.textContent = "";
    message.textContent = "";

    nextBtn.style.display = "none";

    hintUsed = false;

    answer.focus();
}

function normalize(text) {
    return text
        .toLowerCase()
        .trim()
        .replace(/[.,!?']/g, "");
}

function checkAnswer() {

    const userAnswer = normalize(answer.value);

    if (!userAnswer) {
        message.textContent = "Type an answer first!";
        message.className = "message wrong";
        return;
    }

    const correctAnswers = riddles[currentLevel].answers;

    const correct = correctAnswers.some(
        a => normalize(a) === userAnswer
    );

    if (correct) {

        let points = 100;

        if (!hintUsed) {
            points += 50;
        }

        score += points;

        scoreText.textContent = score;

        message.textContent =
            "✅ CORRECT! +" + points + " points";

        message.className = "message correct";

        nextBtn.style.display = "block";

        answer.disabled = true;

    } else {

        lives--;

        livesText.textContent = lives;

        message.textContent =
            "❌ Wrong answer!";

        message.className = "message wrong";

        if (lives <= 0) {

            message.textContent =
                "💀 Game Over! The answer was: " +
                riddles[currentLevel].answers[0];

            restartBtn.style.display = "block";

            answer.disabled = true;

        }
    }
}

function showHint() {

    if (hintUsed) {
        return;
    }

    hintUsed = true;

    hint.textContent =
        "💡 Hint: " + riddles[currentLevel].hint;
}

function nextLevel() {

    currentLevel++;

    if (currentLevel >= riddles.length) {

        document.getElementById("gameScreen").style.display = "none";

        document.getElementById("finalScreen").style.display = "block";

        document.getElementById("finalScore").textContent = score;

        return;
    }

    answer.disabled = false;

    loadLevel();
}

function restartGame() {

    currentLevel = 0;
    lives = 3;
    score = 0;

    livesText.textContent = lives;
    scoreText.textContent = score;

    document.getElementById("gameScreen").style.display = "block";
    document.getElementById("finalScreen").style.display = "none";

    restartBtn.style.display = "none";

    answer.disabled = false;

    loadLevel();
}

answer.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        checkAnswer();
    }

});

loadLevel();

</script>

</body>
</html>
